<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>홍카페 소재 리포트</title>
<style>* { box-sizing: border-box; } body { margin: 0; }</style>
</head>
<body>
<div id="gate-overlay" style="position:fixed;inset:0;background:#f3f5f8;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,'Malgun Gothic',sans-serif;">
  <div style="background:#fff;padding:32px;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.1);width:280px;text-align:center;">
    <h2 style="margin:0 0 16px;font-size:18px;">홍카페 리포트</h2>
    <input id="gate-id" type="text" placeholder="ID" autocomplete="off" style="width:100%;padding:8px 10px;margin-bottom:8px;border:1px solid #d8dce3;border-radius:8px;box-sizing:border-box;">
    <input id="gate-pw" type="password" placeholder="비밀번호" style="width:100%;padding:8px 10px;margin-bottom:12px;border:1px solid #d8dce3;border-radius:8px;box-sizing:border-box;" onkeydown="if(event.key==='Enter') gateTryLogin()">
    <button onclick="gateTryLogin()" style="width:100%;padding:10px;background:#2952e3;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">입장</button>
    <div id="gate-error" style="color:#e0393e;font-size:12px;margin-top:8px;min-height:14px;"></div>
  </div>
</div>
<script>
(function() {
  var GATE_ID = "hongcafeorm";
  var GATE_PW = "orm2026";
  window.gateTryLogin = function() {
    var id = document.getElementById('gate-id').value;
    var pw = document.getElementById('gate-pw').value;
    if (id === GATE_ID && pw === GATE_PW) {
      sessionStorage.setItem('hc_gate_unlocked', '1');
      document.getElementById('gate-overlay').style.display = 'none';
    } else {
      document.getElementById('gate-error').textContent = 'ID 또는 비밀번호가 올바르지 않습니다.';
    }
  };
  document.addEventListener('DOMContentLoaded', function() {
    if (sessionStorage.getItem('hc_gate_unlocked') === '1') {
      var overlay = document.getElementById('gate-overlay');
      if (overlay) overlay.style.display = 'none';
    }
  });
})();
</script>
<div id="shell-root" style="display:flex;height:100vh;font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;">
  <div id="shell-sidebar" style="width:220px;flex:0 0 220px;background:#f7f8fa;border-right:1px solid #e7eaef;padding:20px 0;box-sizing:border-box;overflow:hidden;white-space:nowrap;transition:width .15s ease,flex-basis .15s ease;">
    <div style="padding:0 20px 16px;font-size:15px;font-weight:800;color:#0f172a;">홍카페 소재 리포트</div>
    <button type="button" class="shell-nav-btn active" data-src="meta.html" onclick="shellSwitch(this)"
      style="display:block;width:100%;text-align:left;padding:12px 20px;border:none;background:transparent;font-size:14px;font-weight:600;color:#2952e3;cursor:pointer;border-left:3px solid #2952e3;">Meta 소재별 성과 리포트</button>
    <button type="button" class="shell-nav-btn" data-src="google.html" onclick="shellSwitch(this)"
      style="display:block;width:100%;text-align:left;padding:12px 20px;border:none;background:transparent;font-size:14px;font-weight:600;color:#555;cursor:pointer;border-left:3px solid transparent;">Google 소재별 성과 리포트</button>
  </div>
  <button type="button" id="shell-toggle" onclick="shellToggleSidebar()" title="사이드바 접기/펼치기"
    style="flex:0 0 18px;width:18px;border:none;border-right:1px solid #e7eaef;background:#f7f8fa;cursor:pointer;font-size:11px;color:#97a3b6;padding:0;">‹</button>
  <iframe id="shell-frame" src="meta.html" style="flex:1 1 auto;border:none;width:100%;height:100%;"></iframe>
</div>
<script>
function shellSwitch(btn) {
  document.querySelectorAll('.shell-nav-btn').forEach(b => {
    b.classList.remove('active');
    b.style.color = '#555';
    b.style.borderLeftColor = 'transparent';
  });
  btn.classList.add('active');
  btn.style.color = '#2952e3';
  btn.style.borderLeftColor = '#2952e3';
  document.getElementById('shell-frame').src = btn.dataset.src;
}

function shellApplySidebarState(collapsed) {
  var sidebar = document.getElementById('shell-sidebar');
  var toggleBtn = document.getElementById('shell-toggle');
  sidebar.style.width = collapsed ? '0px' : '220px';
  sidebar.style.flexBasis = collapsed ? '0px' : '220px';
  toggleBtn.textContent = collapsed ? '›' : '‹';
}

function shellToggleSidebar() {
  var collapsed = document.getElementById('shell-sidebar').style.width === '0px';
  shellApplySidebarState(!collapsed);
  try { localStorage.setItem('hc_sidebar_collapsed', (!collapsed) ? '1' : '0'); } catch (e) {}
}

(function() {
  var saved = '0';
  try { saved = localStorage.getItem('hc_sidebar_collapsed') || '0'; } catch (e) {}
  shellApplySidebarState(saved === '1');
})();
</script>

</body>
</html>
